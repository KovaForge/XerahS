app-id: com.getsharex.XerahS
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: xerahs

finish-args:
  # Display. Prefer native Wayland; allow X11 only as a fallback for non-Wayland sessions.
  - --socket=wayland
  - --socket=fallback-x11

  # GPU / Skia acceleration.
  - --device=dri

  # Network is required for upload destinations, update checks, and connected integrations.
  - --share=network

  # XDG Desktop Portals: screenshots, screencasts, file access, OpenURI,
  # notifications, background startup, and global shortcuts when supported by
  # the user's portal backend.
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.Documents

  # StatusNotifierItem tray integration. On GNOME this still depends on a
  # compatible AppIndicator/KStatusNotifier extension.
  - --talk-name=org.kde.StatusNotifierWatcher

# NOTE: Flatpak builds do not rely on host CLI capture tools such as grim,
# slurp, hyprshot, wl-clipboard, xclip, or xdotool. Sandboxed capture and
# recording are portal-first; native CLI fallbacks are reserved for non-sandboxed
# Linux installs.

modules:
  - name: xerahs
    buildsystem: simple
    build-commands:
      # Install self-contained publish to /app
      - cp -rT self-contained /app

      # Flatpak application commands must be installed under /app.
      - mkdir -p /app/bin
      - ln -s ../XerahS /app/bin/XerahS
      - ln -s ../XerahS /app/bin/xerahs

      # Install app icon
      - install -Dm644 com.getsharex.XerahS.png /app/share/icons/hicolor/512x512/apps/com.getsharex.XerahS.png

      # Install .desktop file (converted to use the /usr/bin symlink)
      - install -Dm644 com.getsharex.XerahS.desktop /app/share/applications/com.getsharex.XerahS.desktop

      # Install AppStream metainfo (for software-center compliance)
      - install -Dm644 com.getsharex.XerahS.metainfo.xml /app/share/metainfo/com.getsharex.XerahS.metainfo.xml

      # WebUI dist must exist (copied into publish dir by CopyWebUIDist MSBuild target)
      # Validate it was included
      - test -d /app/frontend/dist || (echo "error: WebUI dist missing at /app/frontend/dist" && exit 1)

      # Fix executable permissions
      - chmod 755 /app/XerahS
      - test -f /app/xerahs-watchfolder-daemon && chmod 755 /app/xerahs-watchfolder-daemon || true

    sources:
      - type: dir
        path: ../dist/xerahs-flatpak-staging
        dest: self-contained
      - type: file
        path: ../src/desktop/app/XerahS.UI/Assets/ShareX.iconset/icon_512x512.png
        dest-filename: com.getsharex.XerahS.png
      - type: file
        path: com.getsharex.XerahS.desktop
      - type: file
        path: com.getsharex.XerahS.metainfo.xml
