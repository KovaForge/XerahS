app-id: com.getsharex.XerahS
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: xerahs

finish-args:
  # X11 + Wayland display
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  # GPU / Skia acceleration
  - --device=dri
  # Network (uploaders, update checks)
  - --share=network
  # Freedesktop notifications
  - --talk-name=org.freedesktop.Notifications
  # DBus screenshot APIs
  - --talk-name=org.kde.KWin.ScreenShot2
  - --talk-name=org.gnome.Shell.Screenshot
  - --talk-name=org.gnome.SettingsDaemon.Plugins.MediaKeys
  # XDG portals (Wayland screenshot, file chooser, notification daemon)
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.Documents
  # System tray on GNOME
  - --talk-name=org.kde.StatusNotifierWatcher
  # DBus session bus
  - --bus=session
  # Filesystem — captures saved here; config read from XDG_CONFIG_HOME
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-config/XerahS
  - --filesystem=xdg-data/XerahS
  - --filesystem=home
  # App Steam (games detection)
  - --talk-name=com.steampowered.steam.AppUpdate

# NOTE: grim, slurp, hyprshot, wl-clipboard, xclip, and xdotool are CLI
# fallbacks for capture regions. On a Flatpak these tools live in the host
# user's PATH and are invoked via ShellCommandCaptureTool. Portal-based
# capture (xdg-desktop-portal) is tried first — see SandboxDetector.cs.

modules:
  - name: xerahs
    buildsystem: simple
    build-commands:
      # Install self-contained publish to /app
      - cp -rT self-contained /app

      # Flatpak application commands must be installed under /app.
      - mkdir -p /app/bin
      - ln -s ../XerahS /app/bin/XerahS
      - ln -s ../XerahS /app/bin/xerahs

      # Install app icon
      - install -Dm644 com.getsharex.XerahS.png /app/share/icons/hicolor/256x256/apps/com.getsharex.XerahS.png

      # Install .desktop file (converted to use the /usr/bin symlink)
      - install -Dm644 com.getsharex.XerahS.desktop /app/share/applications/com.getsharex.XerahS.desktop

      # Install AppStream metainfo (for software-center compliance)
      - install -Dm644 com.getsharex.XerahS.metainfo.xml /app/share/metainfo/com.getsharex.XerahS.metainfo.xml

      # WebUI dist must exist (copied into publish dir by CopyWebUIDist MSBuild target)
      # Validate it was included
      - test -d /app/frontend/dist || (echo "error: WebUI dist missing at /app/frontend/dist" && exit 1)

      # Fix executable permissions
      - chmod 755 /app/XerahS
      - test -f /app/xerahs-watchfolder-daemon && chmod 755 /app/xerahs-watchfolder-daemon || true

    sources:
      - type: dir
        path: ../dist/xerahs-flatpak-staging
        dest: self-contained
      - type: file
        path: ../src/desktop/app/XerahS.UI/Assets/Logo.png
        dest-filename: com.getsharex.XerahS.png
      - type: file
        path: com.getsharex.XerahS.desktop
      - type: file
        path: com.getsharex.XerahS.metainfo.xml
