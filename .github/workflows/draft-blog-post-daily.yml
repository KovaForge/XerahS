name: Draft Daily Blog Posts

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-blog-post-daily
  cancel-in-progress: false

jobs:
  upsert-drafts:
    runs-on: windows-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure git identity
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refresh previous UTC+8 draft only if it already exists
        shell: pwsh
        run: |
          $utcOffset = [TimeSpan]::FromHours(8)
          $targetDate = [DateTimeOffset]::UtcNow.ToOffset($utcOffset).AddDays(-1).ToString("yyyy-MM-dd")
          $targetFile = Join-Path "docs/blog" (Join-Path ([DateTimeOffset]::UtcNow.ToOffset($utcOffset).AddDays(-1).ToString("yyyy")) (Join-Path ([DateTimeOffset]::UtcNow.ToOffset($utcOffset).AddDays(-1).ToString("yyyy-MM")) ("blog-" + [DateTimeOffset]::UtcNow.ToOffset($utcOffset).AddDays(-1).ToString("yyyyMMdd") + ".md")))

          if (-not (Test-Path $targetFile)) {
            Write-Host "Previous-day draft does not exist in repo, skipping creation to avoid add/add merge conflicts."
            exit 0
          }

          Write-Host "Existing draft found at $targetFile. No auto-creation performed by GitHub Actions."

      - name: Commit and push draft updates
        shell: pwsh
        run: |
          $changedFiles = git status --porcelain -- docs/blog
          if ([string]::IsNullOrWhiteSpace($changedFiles)) {
            Write-Host "No draft changes detected."
            exit 0
          }

          git add docs/blog
          git commit -m "[Docs] Refresh existing UTC+8 blog drafts only"
          git push origin HEAD:develop
