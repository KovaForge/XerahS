name: Markdown Hygiene

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions: read-all

jobs:
  markdown-hygiene:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Markdown hygiene check
        run: python scripts/check-markdown-mojibake.py
