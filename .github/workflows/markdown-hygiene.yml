name: Markdown Hygiene

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check-markdown-mojibake.py"
      - ".githooks/pre-commit.bash"
      - ".githooks/pre-commit.ps1"
      - ".githooks/README.md"
      - ".github/workflows/markdown-hygiene.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "**/*.md"
      - "scripts/check-markdown-mojibake.py"
      - ".githooks/pre-commit.bash"
      - ".githooks/pre-commit.ps1"
      - ".githooks/README.md"
      - ".github/workflows/markdown-hygiene.yml"

jobs:
  markdown-hygiene:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Markdown hygiene check
        run: python scripts/check-markdown-mojibake.py
