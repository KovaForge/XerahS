name: XerahS Cloud Staging Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xerahs-cloud-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    environment: xerahs-cloud-staging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - run: pnpm install --frozen-lockfile
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - run: supabase db push --include-all
      - run: pnpm dlx vercel@59.4.0 pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - run: pnpm dlx vercel@59.4.0 build --token="$VERCEL_TOKEN"
      - run: pnpm dlx vercel@59.4.0 deploy --prebuilt --token="$VERCEL_TOKEN"
